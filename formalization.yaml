fidelity:
  divergences: >-
    Statements corrected (REPORT.md, Sections 4 and 6): ECToBlob Theorem 8.2 for parameters meeting Assumption 1, as agreed
    with the user (E10); ECToBlob Theorem 8.2 with positive alternatives for the Cauchy and CBC variants, under the continuous
    extension of the Cauchy transform at p = 1, where the printed formula is undefined, as agreed with the user (E11); ECToBlob
    equation (3.3) weighted by block sizes (E2); the margin of TOB-QMC's supplement Lemma 4, vacuous as printed (E22);
    its Lemma 2, forward direction only (E23); its Lemma 8 for nontrivial blobs (E26); TINNiK's maximum likelihood estimate on
    the closed simplex (E31). Library statements omit hypotheses that the proofs do not use (REPORT.md, Section 5);
    Challenge.lean keeps them. Readings: REPORT.md, Section 6. Departures from the papers' proofs (REPORT.md, Section 7).
    Forced, repairing gaps: ECToBlob Theorem 3.1 (E2), Corollary 3.6 (E3), Theorem 8.2 (E11-E17), TOB-QMC supplement Lemma 4
    (E22, E24), TINNiK Theorem 4 under the alternative (E33). Forced, because Lean lacks the mathematics: TINNiK Proposition 5,
    by a direct central limit argument in place of van der Vaart's Theorem 16.7; TINNiK Theorem 4's exclusion of the centroid, without
    analyticity; ECToBlob Proposition 5.1's generic clause, assumed. Not forced, and kept, as disclosed in the report: TOB-QMC Lemma 3's second
    observation and Lemma 4's wedge paths, in favour of shorter arguments on the rooted subgraph; TOB-QMC's consistency claim,
    by a finer argument than the citation (E21); TINNiK Proposition 6's integrals, in Cartesian coordinates with the paper's
    intermediate formulas; TINNiK Theorem 4's null case; and the cited Lemma 3 of Allman et al. and Theorem 2 of Rhodes.

review:
