version: "v0.4"

project:
  name: "Tree of blobs inference from quartet concordance factors"
  description: >-
    Conditional on one result of the literature: Corollary 1 of Allman, Baños, Mitchell, Rhodes 2023 (the
    CF-detectability of 4-blobs for generic parameters), in its original form and in the form ECToBlob adapts.


    A Lean formalization of three papers on inferring the tree of blobs of a phylogenetic network from gene trees under
    the network multispecies coalescent: ECToBlob (Rhodes, Allman, Ané, Baños 2026), TOB-QMC (Dai, Han, Molloy 2026) and
    TINNiK (Allman, Baños, Mitchell, Rhodes 2024).


    Proved: optimal trees of the maximum quartet support criterion resolve the tree of blobs; if every quartet across a
    quadripartition has the split as a cut-edge split then the network has that cut edge (ECToBlob Theorem 4.1);
    statistical consistency of the ECToBlob algorithm for all its variants, with sequences of levels independent of the
    network; a disjoint cover of quartets around each edge detects false edges at level 1, and its statistical
    consistency; statistical consistency of the TINNiK algorithm; the limit laws of the star, T1 and cut tests from the
    central limit theorem; the density of the cut test; and the network multispecies coalescent on arbitrary networks with
    correlated inheritance, with exchangeability across cut edges.


    The audit records 34 findings in the papers, including a counterexample to a boundary case of ECToBlob's Theorem 8.2
    and a gap in its proof that needed a new argument.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

