status:
  scope: >-
    Conditional formalization. It assumes Corollary 1 of Allman et al. 2023 (External.AllmanEtAl2023.Corollary1), and the
    adaptation that ECToBlob's Proposition 5.1 makes of it (ECToBlob.AdaptedAllmanTheorem1, its generic clause), as named
    hypotheses. TINNiK Theorem 4 and ECToBlob Proposition 5.1 are conditional on them. All other numbered results of the
    three papers and the results they cite are proved. Theorem 8.2 of ECToBlob is proved under two corrections, for
    parameters meeting both directions of Assumption 1, and, for two variants of the algorithm, positive alternatives on
    quartets strictly in the T1 null; the second correction, which has a counterexample under the continuous extension of
    the Cauchy transform, was agreed with the requester.
    Not formalized: simulations, running times, neighbor joining as an exact tree builder, the T3 test, heuristic
    optimizers, and Remarks 8.3 and 8.4 of ECToBlob as theorems. See REPORT.md, Section 9.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

