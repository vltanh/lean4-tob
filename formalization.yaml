  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs with the papers'; a
    separate agent checked the findings. The route check and Comparator ran locally.

alignment:
  namespace: "Challenge"
  statements:
    - source: "ECToBlob, Theorem 3.1"
      lean: "Challenge.theorem3_1"
      module: "Challenge"
      status: "proved"
      note: "Condition 2 in the form the proof uses; ECToBlob.pendantChainInvariant_cutExchangeable derives it from the literal form."
    - source: "ECToBlob, Theorem 4.1"
      lean: "Challenge.theorem4_1"
      module: "Challenge"
      status: "proved"
      note: "As printed."
    - source: "ECToBlob, Theorem 8.2"
      lean: "Challenge.theorem8_2"
      module: "Challenge"
      status: "proved, corrected"
      note: "Corrections E10 and E11, agreed. Binary gene trees."
    - source: "TOB-QMC v5, Theorem 1"
      lean: "Challenge.theorem1"
      module: "Challenge"
      status: "proved"
      note: "With deterministic K, as printed."
    - source: "TOB-QMC v5, Theorem 1, the 'put simply' form"
      lean: "Challenge.theorem1_optimal"
      module: "Challenge"
      status: "proved"
      note: "Almost surely, for all large k, every optimal solution refines the tree of blobs."
    - source: "TOB-QMC v5, Theorem 2"
      lean: "Challenge.theorem2"
      module: "Challenge"
      status: "proved"
      note: "As printed, B is any refinement; Definition 2's quadripartition is read as the multipartition at the edge."
    - source: "TOB-QMC v5, consistency claim of §4.3"
      lean: "Challenge.consistency"
      module: "Challenge"
      status: "proved"
      note: "Under the printed assumptions, with TINNiK's cut test (assumption 6a). The T3 option is not treated."
    - source: "TINNiK, Theorem 4"
      lean: "Challenge.theorem4"
      module: "Challenge"
      status: "conditional"
      note: "Conditional on External.AllmanEtAl2023.Corollary1. One level sequence for all networks and parameters."

