name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # `lake build` builds only the modules of the library that this project imports; the audit reads all of them.
      - name: Build the whole library
        run: lake build Phylogenetics
      # The audit sees a module's proofs only through its own `import all` line, for the modules of this
      # project and of the library `Phylogenetics`.
      - name: Check that the audit imports every module of the libraries
        run: python3 scripts/gen_audit.py --check
      - name: Audit axioms and dependencies
        run: lake env lean -DautoImplicit=false -DmaxSynthPendingDepth=3 scripts/Audit.lean
      # The routes of the papers' proofs (docs/paper_routes.tsv) and the reviewed differences
      # (docs/route_differences.tsv).
      - name: Check that the proofs follow the routes of the papers' proofs
        run: >-
          python3 scripts/route_check.py check docs/paper_routes.tsv
          --accept docs/route_differences.tsv
      # Every import between units of `src/` is one that scripts/layers.toml allows, and the units form no cycle.
      - name: Check the imports between units
        run: python3 scripts/check_layers.py
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: python3 scripts/check_md_tables.py README.md docs/REPORT.md docs/CREDITS.md papers/*/README.md papers/*/REPORT.md
