version: "v0.4"

project:
  name: "A decomposition theory for phylogenetic networks and incompatible characters"
  description: >-
    A Lean formalization of Gusfield, Bansal, Bafna, Song 2007, the decomposition theory of phylogenetic networks with
    recombination and incompatible characters, with the sources that only it uses: Gusfield 1991, Gusfield, Eddhu,
    Langley 2004, Myers, Griffiths 2003, Hudson, Kaplan 1985 and Song, Hein 2005. It imports Mathlib only, and no result
    of the literature is assumed. No person has reviewed the proofs.


    Proved: the Decomposition Theorem for phylogenetic networks, the sufficient conditions for decomposability, and the
    refutation of all four Full-Decomposition Optimality Conjectures; every other numbered result but Theorem 4, which
    is false as printed and whose true form is proved in both directions; the sentences at lines 135, 156, 180, 299,
    329, 381, 403, 411, 418, 420, 554, 559, 590 and 608, Footnote 2, and the numbers of Figures 5-10. Of the sources,
    the Perfect Phylogeny Theorem, the galled-tree results of Gusfield, Eddhu, Langley 2004 with an algorithm proved
    correct, the haplotype bound and the integer program of Myers, Griffiths 2003, the bound of Hudson, Kaplan 1985 and
    the bound by ordered SPR of Song, Hein 2005.


    The audit records E42-E54 and E67 on the paper, including that Theorem 4 is false as printed, and E76-E79 and E85 on
    the sources.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

