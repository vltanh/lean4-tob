    - source: "Gusfield et al. 2007, Theorem 10 without an ancestral sequence"
      lean: "TreeOfBlobs.gusfield_theorem10_unrooted"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "Not in the paper."
    - source: "Gusfield et al. 2007, Theorem 10 with R(M + S) read by the definition at line 385, single crossovers"
      lean: "TreeOfBlobs.gusfield_theorem10Printed_single_false"
      module: "MainResults.Gusfield2007"
      status: "proved, refutes that literal reading"
      note: "Fourteen rows on eight sites. The paper's own use of the symbol at lines 525 and 560 suggests a slip for R_S(M), under which the theorem is proved."
    - source: "Gusfield et al. 2007, Theorem 10 with R(M + S) read by the definition at line 385, multiple crossovers"
      lean: "TreeOfBlobs.gusfield_theorem10Printed_multiple_false_of_search"
      module: "MainResults.Gusfield2007"
      status: "proved under a stated hypothesis"
      note: "Conditional: its hypothesis printedMSearch, a finite computation, isn't proved, since the kernel hasn't completed it. Seventy-four rows on thirty-four sites."
    - source: "Gusfield et al. 2007, line 329, with the entry node counted"
      lean: "TreeOfBlobs.gusfield_exists_isEfficientAtEntry"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "The paper gives no modification."
    - source: "Gusfield et al. 2007, Section 4.2, a merged blob"
      lean: "TreeOfBlobs.gusfield_treeness_merged_false"
      module: "MainResults.Gusfield2007"
      status: "proved, refutes the source"
      note: "The inequality fails for a blob merging two trivial components."
    - source: "Gusfield et al. 2007, line 656, with equality"
      lean: "TreeOfBlobs.gusfield_Md_R_eq"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "The paper claims the upper bound."
    - source: "Gusfield et al. 2007, line 590, Conjecture 1 of Huson and Klöpper"
      lean: "TreeOfBlobs.gusfield_conjecture22_false"
      module: "MainResults.Gusfield2007"
      status: "proved, refutes the source"
      note: "As Conjecture 2.2 of Klöpper's thesis states it; the RECOMB paper wasn't reachable."
    - source: "Gusfield, Eddhu, Langley 2004, in the proof of Theorem 2.2"
      lean: "TreeOfBlobs.galled_exists_isCycle_of_conflict"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "By tracing states, not by contracting edges, a step that has no proof in the source."
    - source: "Gusfield, Eddhu, Langley 2004, Theorem 2.2"
      lean: "TreeOfBlobs.galled_theorem2_2"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "The ancestral sequence is any."
    - source: "Gusfield, Eddhu, Langley 2004, Theorem 8.3"
      lean: "TreeOfBlobs.galled_theorem8_3"
      module: "MainResults.Gusfield2007"
      status: "proved"
