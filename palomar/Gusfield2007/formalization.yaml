status:
  scope: >-
    Unconditional: no result of the literature is assumed, and one main theorem, named below, has a computation as a
    visible hypothesis. Every numbered result of Gusfield et al. 2007 is proved as printed or in a corrected form
    (Lemmas 1-5; Theorems 1, 2, 3, 5, 6, 7, 8, 9, 11; Corollaries 1, 2, 3; and the refutation of all four
    Full-Decomposition Optimality Conjectures). Theorem 4 is false as printed: its counterexamples and true forms are
    proved. Theorem 10 is proved with the rooted count R_S(M), in each crossover model, which the paper's own use of R(M
    + S) at lines 525 and 560 suggests is meant. If R(M + S) is read by the definition at line 385, it is false for
    single crossovers, and for multiple crossovers it is false given a finite computation that the kernel hasn't
    completed, the hypothesis of TreeOfBlobs.gusfield_theorem10Printed_multiple_false_of_search. Not formalized: Table
    1, the simulation study of §5.4 and the eight counterexamples it reports, and results of cited sources that no proof
    here uses. Open: Gusfield2007.MinDecomposableOfForallS, line 425, and Theorem 10 for multiple crossovers with that
    literal reading, as above. See Section 9 of docs/reports/Gusfield2007.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

