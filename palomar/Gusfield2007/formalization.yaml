    The user chose the papers and the versions of the first three, agreed to the statement corrections of ECToBlob and TOB-QMC, and decided the library's boundary, the layout, the kernels and publication. AI systems wrote the code, the statements, the audit and the documents. The automation above is for the whole project, of five papers, each with an entry of its own in palomar/. Now src/ has 274 modules; the audit checks 26,537 declarations, of the project and the library, all on the standard axioms; three kernels accept the 38 main theorems of this entry (scripts/check_kernels.sh palomar/Gusfield2007/comparator.json). See docs/CREDITS.md.

fidelity:
  divergences: >-
    Statements corrected (Sections 3, 4 and 6 of docs/reports/Gusfield2007.md): Theorem 4, false as printed, proved with
    the entry node of a blob counted, with no site-free non-pendant arc that has both ends off the blobs, and two
    conventions (E42, E43, E44), and with the printed definition of efficient as an exact characterization; Theorem 10
    with the rooted count R_S(M), in each crossover model and with no hypothesis on the columns, as the paper's own use
    of R(M + S) at lines 525 and 560 suggests; if that symbol is read by the definition at line 385, the statement is
    false for single crossovers, and for multiple crossovers given a finite computation that the kernel hasn't completed
    (E50, E51); lines 156, 180, 373, 403, 554 and 560, false as printed, with their true forms (E45-E50, E67). The
    entry-node repair of Theorem 4 is in print, in Gusfield's 2014 book (E42). Library statements omit hypotheses that
    the proofs do not use (Section 5 of the report); src/MainResults/Gusfield2007.lean keeps them. Readings: Section 6
    of the report. False claims found, not formalized as stated: Corollary 2.1 of Gusfield et al. 2004 in one direction
    (E76).


    Departures from the papers' proofs, every one with what the paper does, what Lean does and why, in Section 7 of the
    report. Repairing gaps or errors: Gusfield et al. 2004's general fact, by tracing states in place of deleting arcs,
    its Theorem 2.7, and its Section 8 on one fixed galled tree (E77); Gusfield et al. Lemma 4's other cases (line 295),
    Theorem 4 (E42-E44), line 373 (E45), line 156 (E46), line 403 as an implication between conjectures and the rooted
    refutation at line 590 (E48), lines 187-190 (the proof of Theorem 1, not its statement), line 264 (contracting the
    tree of the Perfect Phylogeny Theorem), line 418, computing F without Theorem 4, line 576 and Theorem 6 (E53),
    Theorem 10, by pairs of labels on two sites in place of visible nodes (E50, E51), line 299 at a central root (E53).
    Not forced, and documented: Myers and Griffiths' Algorithm 3 (a set of nodes of a network, in place of a history);
    Gusfield et al. 2004's algorithm (recombination points tried, one rule of cluster inclusion, a proof in place of the
    final check), its Corollary 5.1 (gluing in place of moving sites) and reduced galled trees (a threshold on a gall in
    place of its arrays); Gusfield et al. line 411 (re-rooting and Corollary 3: Bandelt et al. give the decomposition at
    cut nodes of the median network, neither paper writes its link to the components of G(M), which Dress et al. 2011
    state for Buneman graphs, and that route wasn't built, for its cost), line 299 (the root of T-bar at a row of M + S,
    which avoids a central root), and line 135 (all shared tops of blobs at once). No printed argument to follow, or a
    source not read: Gusfield et al. lines 329-330, the inflation in Theorem 1 (the paper gives no construction), line
    554; lower bounds on R for Figures 5 and 8 (the paper runs programs, Lean has a verified search); Gusfield 1991,
    Semple and Steel 2003 (not read: standard arguments). docs/route_differences.tsv records every difference of route.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs with the papers'; a
    separate agent checked the findings. The route check and the three kernels (scripts/check_kernels.sh: Lean's kernel, NanoDa, con-ron) ran locally; Comparator runs on src/MainResults/Gusfield2007.lean as both challenge and solution, so it compares no separate statement file with a proof.

alignment:
  namespace: "TreeOfBlobs"
  statements:
    - source: "Gusfield et al. 2007, Theorem 1"
      lean: "TreeOfBlobs.gusfield_theorem1"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "M nonempty, implicit in the paper; no constant column, its standing assumption at line 112."
    - source: "Gusfield et al. 2007, Theorem 3"
      lean: "TreeOfBlobs.gusfield_theorem3"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "In all three crossover models."
    - source: "Gusfield et al. 2007, Lemma 4"
      lean: "TreeOfBlobs.gusfield_lemma4"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "A trivial component keeps both of its columns, so the second clause is for a non-trivial component."
    - source: "Gusfield et al. 2007, Theorem 4, with the entry node counted"
      lean: "TreeOfBlobs.gusfield_theorem4_entry"
      module: "MainResults.Gusfield2007"
      status: "proved, corrected"
      note: "True form: T′ is T̄ exactly when N is efficient at entry, with RegularArcs and the degree condition. The repair is in Gusfield's 2014 book, for canonical ARGs, read only in snippets; the exact characterization, the failure under the printed definition and the kernel check are this formalization's."
    - source: "Gusfield et al. 2007, Theorem 4, exactly"
      lean: "TreeOfBlobs.gusfield_theorem4_iff"
      module: "MainResults.Gusfield2007"
      status: "proved, corrected"
      note: "True form, with the printed definition of efficient."
    - source: "Gusfield et al. 2007, Theorem 4, the hypotheses can be met"
      lean: "TreeOfBlobs.gusfield_exists_realization"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "Not in the paper; for every M with at least three rows."
    - source: "Gusfield et al. 2007, Theorem 4, false as printed"
      lean: "TreeOfBlobs.gusfield_theorem4_false_top"
      module: "MainResults.Gusfield2007"
      status: "proved, refutes the source"
      note: "The definition of efficient omits the entry node of a blob."
    - source: "Gusfield et al. 2007, Theorem 4, false on a site-free arc"
      lean: "TreeOfBlobs.gusfield_theorem4_false_siteFree"
      module: "MainResults.Gusfield2007"
      status: "proved, refutes the source"
      note: "A failure the entry node doesn't account for."
    - source: "Gusfield et al. 2007, Theorem 5"
      lean: "TreeOfBlobs.gusfield_theorem5"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "As printed."
    - source: "Gusfield et al. 2007, Theorem 6"
      lean: "TreeOfBlobs.gusfield_theorem6"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "A network with only single crossovers also obeys multiple, and then both conclusions hold."
    - source: "Gusfield et al. 2007, Theorem 7"
      lean: "TreeOfBlobs.gusfield_theorem7"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "As printed."
    - source: "Gusfield et al. 2007, Theorem 8"
      lean: "TreeOfBlobs.gusfield_theorem8"
      module: "MainResults.Gusfield2007"
      status: "proved"
      note: "A misprint in the proof, not in the statement."
    - source: "Gusfield et al. 2007, Theorem 9"
