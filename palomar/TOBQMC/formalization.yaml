version: "v0.4"

project:
  name: "TOB-QMC: quartet-based species tree methods for tree of blobs reconstruction"
  description: >-
    A Lean formalization of TOB-QMC (Dai, Han, Molloy 2026): quartet-based species tree methods give a refinement of the
    tree of blobs, and tests on a linear number of quartets around each edge remove the false edges at level 1, under
    the network multispecies coalescent. No result of the literature is assumed. No person has reviewed the proofs.


    Proved: almost surely, every optimal solution of the quartet criterion refines the tree of blobs (Theorem 1); a
    disjoint cover of quartets around each edge detects false edges at level 1 (Theorem 2); the statistical consistency
    claim of §4.3; every other numbered result, the claims of the supplement at level 1, and their failure at level 2.
    Of the sources it cites, Proposition 12 of Ané et al. 2024, Theorem 5.1 of Huber et al. 2025, Theorem 1 of Dinh,
    Baños 2025 and the bound of Theorem 1 of Kane, Tao 2017.


    The audit records E18-E28, E39, E69-E74 and E83, including that the supplement's Lemma 7 and Theorem 1 are false at
    level 2.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

