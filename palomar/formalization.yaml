status:
  scope: >-
    Unconditional: no result of the literature is assumed, and one main theorem, named below, has a computation as a visible hypothesis. Every numbered result of the five papers is proved as printed or in a corrected form, and the results they cite are proved, in src/External and src/AllmanEtAl2023. Theorem 4 of Gusfield et al. 2007 is false
    as printed: its counterexamples and true forms are proved. Theorem 10 of that paper is proved with the rooted count, in each crossover model. As printed, with the unrooted count, it is false for single crossovers, and for multiple crossovers it is false given
    a finite computation that the kernel hasn't completed, the hypothesis of TreeOfBlobs.gusfield_theorem10Printed_multiple_false_of_search. Lemma 2 of Allman et al. 2023 is
    proved for a connected subnetwork, which all its uses have. Theorem 8.2 of ECToBlob is proved under two corrections, for parameters
    meeting both directions of Assumption 1, and, for two variants of the algorithm, positive alternatives on quartets strictly in the T1
    null, under the continuous extension of the Cauchy transform; both were agreed with the requester. Not formalized: simulations and
    empirical tables, running times on a machine (counts of operations are), heuristic optimizers, NANUQ beyond its distance, rule 1 of Ané et al. 2024 in general,
    Theorem 5.1 of Gusfield et al. 2004 for networks that aren't galled trees. Open, and stated in Lean: Gusfield2007.MinDecomposableOfForallS, and the open question of ECToBlob's Remark 3.4, ECToBlob.Remark34.OpenQuestion. See
    docs/REPORT.md, Section 9.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

