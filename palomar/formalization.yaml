version: "v0.4"

project:
  name: "Tree of blobs inference from quartet concordance factors"
  description: >-
    A Lean formalization of five papers on the tree of blobs of a phylogenetic network. Three infer it from gene trees under
    the network multispecies coalescent: ECToBlob (Rhodes, Allman, Ané, Baños 2026), TOB-QMC (Dai, Han, Molloy 2026) and
    TINNiK (Allman, Baños, Mitchell, Rhodes 2024). Allman, Baños, Mitchell, Rhodes 2023 prove that it is identifiable, and
    Gusfield, Bansal, Bafna, Song 2007 give the decomposition theory of networks and incompatible characters. No result of the
    literature is assumed. No person has reviewed the proofs.


    Proved: optimal trees of the maximum quartet support criterion resolve the tree of blobs; if every quartet across a
    quadripartition has the split as a cut-edge split then the network has that cut edge (ECToBlob Theorem 4.1);
    statistical consistency of the ECToBlob algorithm for all its variants, with sequences of levels independent of the
    network; a disjoint cover of quartets around each edge detects false edges at level 1, and its statistical
    consistency; statistical consistency of the TINNiK algorithm; the limit laws of the star, T1 and cut tests from the
    central limit theorem; the density of the cut test; the network multispecies coalescent on arbitrary networks with
    correlated inheritance, with exchangeability across cut edges; the CF-detectability of 4-blobs for generic
    parameters, the B-quartet Inference Rule and the identifiability of the reduced tree of blobs (Allman et al. 2023); and the
    Decomposition Theorem for phylogenetic networks, the sufficient conditions for decomposability, and the refutation of the
    Full-Decomposition Optimality Conjectures (Gusfield et al. 2007).


    The audit records 66 findings in the papers, including that Theorem 4 of Gusfield et al. 2007 is false as printed, a
    counterexample to a boundary case of ECToBlob's Theorem 8.2, and a gap in its proof that needed a new argument.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

