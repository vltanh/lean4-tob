status:
  scope: >-
    All numbered results of the five papers and the results they cite are proved, with no assumed result. Theorem 4 of Gusfield
    et al. 2007 is false as printed: its counterexamples and true forms are proved. Theorem 8.2 of
    ECToBlob is proved under two corrections, for parameters meeting both directions of Assumption 1, and, for two variants of the
    algorithm, positive alternatives on quartets strictly in the T1 null, under the continuous extension of the Cauchy transform.
    Both were agreed with the requester. Not formalized: simulations, running times, neighbor joining as an exact tree builder, the
    T3 test, heuristic optimizers, and Remarks 8.3 and 8.4 of ECToBlob as theorems. See docs/REPORT.md, Section 9.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

