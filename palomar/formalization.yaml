status:
  scope: >-
    Unconditional: no result of the literature is assumed. Every numbered result of the five papers is proved as printed or in a
    corrected form, and the results they cite are proved, in src/External and src/AllmanEtAl2023. Theorem 4 of Gusfield et al. 2007 is false
    as printed: its counterexamples and true forms are proved. Theorem 10 of that paper has a notation slip: it is proved with the
    rooted count, and for single crossovers with distinct columns, and the printed form stays open. Lemma 2 of Allman et al. 2023 is
    proved for a connected subnetwork, which all its uses have. Theorem 8.2 of ECToBlob is proved under two corrections, for parameters
    meeting both directions of Assumption 1, and, for two variants of the algorithm, positive alternatives on quartets strictly in the T1
    null, under the continuous extension of the Cauchy transform; both were agreed with the requester. Not formalized: simulations and
    empirical tables, running times on a machine (counts of operations are), heuristic optimizers, ECToBlob's Theorem 8.2 for the displayed
    tree model on non-binary networks, NANUQ beyond its distance, Huson and Klöpper's Conjecture 1, and the optimality count for galled trees
    at Gusfield et al.'s line 381. Open, and stated in Lean: Gusfield2007.MinDecomposableOfForallS, Gusfield2007.Theorem10Printed. See
    docs/REPORT.md, Section 9.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

