        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links; statement corrections asked of the user and approved."
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code (VS Code extension)"
      tool_setup: "formalize-math-paper skill, repository vltanh/formalize-math-paper, commit e339f64; Claude Code 2.1.314; 53 sub-agents, at most 11 at once."
      cost:
        wall_time: "10.79 h elapsed, 2026-10-31, including 1.67 h for the round that proved the assumed result and 3.36 h for the round that followed the sources and formalized what the papers say in passing; sub-agent work 32.2 h"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links, continuing from the earlier handoff; later the user asked to match the sources closely, and to formalize what the report listed as not formalized."
  spend_usd: "not tracked"
  notes: >-
    The user chose the papers and the source versions and agreed to the statement corrections. AI systems wrote the code, the statements, the audit and the documents. See docs/CREDITS.md.

fidelity:
  divergences: >-
    Statements corrected (docs/REPORT.md, Sections 4 and 6): ECToBlob Theorem 8.2 for parameters meeting Assumption 1, as agreed
    with the user (E10); ECToBlob Theorem 8.2 with positive alternatives for the Cauchy and CBC variants, under the continuous
    extension of the Cauchy transform at p = 1, where the printed formula is undefined, as agreed with the user (E11); ECToBlob
    equation (3.3) weighted by block sizes (E2); the margin of TOB-QMC's supplement Lemma 4, vacuous as printed (E22);
    its Lemma 2, forward direction only (E23); its Lemma 8 for nontrivial blobs (E26); TINNiK's maximum likelihood estimate on
    the closed simplex (E31). Library statements omit hypotheses that the proofs do not use (docs/REPORT.md, Section 5);
    src/MainResults.lean keeps them. Readings: docs/REPORT.md, Section 6. Departures from the papers' proofs (docs/REPORT.md, Section 7).
    Repairing gaps: ECToBlob Theorem 3.1 (E2), Corollary 3.6 (E3), Theorem 8.2 (E11-E17), TOB-QMC supplement Lemma 4
    (E22, E24), TOB-QMC Lemma 4 (E19), Corollary 1 (E20) and consistency (E21), TINNiK Theorem 4 under the alternative (E33). Because Lean lacks the mathematics: TINNiK Proposition 5, by a direct
    central limit argument in place of van der Vaart's Theorem 16.7. Not forced, and documented: ECToBlob Theorem 4.1 (3-blobs and chains on the unsuppressed graph) and Proposition 5.1 (on the network, not on each quarnet);
    TOB-QMC Lemma 1, Lemma 4 (no suppression) and supplement Lemma 8 (a lowest reticulation, not disjoint paths); among cited results, Allman et al.'s Theorem 1 (no 2-blob step; Lemma 1 not stated; one argument across the rooted forms;
    deleted networks in the coordinates of the network; only part of strictly cut off a deletion) and Corollary 1 (the induced network cut at the LSA, not their Definition 6). Other cited results: neighbor joining
    (Studier and Keppler's Lemma fails at polytomies), NANUQ Theorem 36 (no centroid CF; levels), Ane et al. Proposition 12 (conditioning at the arc). NANUQ Proposition 9, Buneman's theorem, ASTRAL's dynamic program and the T3 theorems have
    no printed proof that was followed. False claims found, not formalized as stated: ECToBlob Remark 8.4 on a non-binary network (E35), ECToBlob Remark 3.3 under the cited non-strict definition (E36), NANUQ Theorem 36 as printed.

review:
  status: "agent-reviewed"
  reviewers:
