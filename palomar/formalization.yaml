fidelity:
  divergences: >-
    Statements corrected (docs/REPORT.md, Sections 3, 4 and 6). ECToBlob: Theorem 8.2 for parameters meeting Assumption 1, as agreed
    with the user (E10); with positive alternatives for the Cauchy and CBC variants, under the continuous extension of the Cauchy
    transform at p = 1, where the printed formula is undefined, as agreed with the user (E11); on binary gene trees (E37); equation (3.3)
    weighted by block sizes (E2). TOB-QMC: the margin of its supplement Lemma 4, vacuous as printed (E22); its Lemma 2, forward direction
    only (E23); its Lemma 8 for nontrivial blobs (E26). TINNiK: the maximum likelihood estimate on the closed simplex (E31). Gusfield et al.
    2007: Theorem 4, false as printed, proved with the entry node of a blob counted, with no site-free non-pendant arc that has both ends off the blobs, and two conventions
    (E42, E43, E44), and with the printed definition of efficient as an exact characterization; Theorem 10 with the rooted count, and for
    single crossovers distinct columns (E50, E51); lines 156, 180, 373, 403, 554 and 560, false as printed, with their true forms (E45-E50). The entry-node repair of Theorem 4 is in print, in Gusfield's 2014 book (E42).
    Allman et al. 2023: Lemma 2 for a connected subnetwork (E55); the remark on edge lengths between trivial blobs for internal edges
    (E64). Library statements omit hypotheses that the proofs do not use (docs/REPORT.md, Section 5); src/MainResults.lean keeps them.
    Readings: docs/REPORT.md, Section 6. False claims found, not formalized as stated: ECToBlob Remark 8.4 on a non-binary network (E35),
    ECToBlob Remark 3.3 under the cited non-strict definition (E36), NANUQ Theorem 36 as printed.


    Departures from the papers' proofs, every one with what the paper does, what Lean does and why, in docs/REPORT.md, Section 7. Repairing
    gaps or errors: ECToBlob Theorem 3.1 (E2), Remark 3.2 (E1), Corollary 3.6 (E3), Theorem 8.2 (E11-E17); TOB-QMC supplement Lemma 4 (E22, E24),
    Lemma 4 (E19), Corollary 1 (E20) and consistency (E21); TINNiK Theorem 4 under the alternative (E33); Gusfield et al. Lemma 4's other cases
    (line 295), Theorem 4 (E42-E44), line 373 (E45), line 156 (E46), line 403 as an implication between conjectures and the rooted refutation at
    line 590 (E48), lines 187-190 (the proof of Theorem 1, not its statement), line 264 (contracting the tree of the Perfect Phylogeny Theorem), line 418,
    computing F without Theorem 4, line 576 and Theorem 6 (E53), Theorem 10 (E50, E51); Allman et al. Theorem 1 (b), a stem
    removed as well as nodes suppressed (E58); neighbor joining (Studier and Keppler's Lemma fails at polytomies); NANUQ Theorem 36 (no centroid
    CF; levels). Because Lean lacks the mathematics: TINNiK Proposition 5, by a direct central limit argument in place of van der Vaart's Theorem
    16.7. Not forced, and documented: ECToBlob Theorem 4.1 (3-blobs and chains on the unsuppressed graph) and Proposition 5.1 (on the network, not
    on each quarnet); TOB-QMC Lemma 1, Lemma 4 (no suppression) and supplement Lemma 8 (a lowest reticulation, not disjoint paths); Allman et al.
    Theorem 1 (a) (the rooted forms select the edge, and one argument follows), Theorem 2 (the same facts on cut-edge splits), and Theorem 3 (two sentences
    unused); Gusfield et al. line 411 (re-rooting and Corollary 3: Bandelt et al. give the decomposition at cut nodes of the median network, neither paper writes
    its link to the components of G(M), which Dress et al. 2011 state for Buneman graphs, and that route wasn't built, for its cost), line 299 (the root of T-bar at a row of M + S, which avoids a central root), and
    line 135 (all shared tops of blobs at once); Ane et al. Proposition 12 (conditioning at the arc). No printed argument to follow, or a source not read: Allman et al. Lemma 1 and its remarks with no
    proof, Baños's claim on level-1 networks; Gusfield et al. lines 329-330, the inflation in Theorem 1 (the paper gives no construction), line 554;
    lower bounds on R for Figures 5 and 8 (the paper
    runs programs, Lean has a verified search); Gusfield 1991, Semple and Steel 2003, Song and Hein 2005 (not read: standard arguments); Gusfield et al.
    2004 (no surgery, and one blob, not its one cycle; a threshold on a gall in place of its arrays); NANUQ Proposition 9, Buneman's theorem, ASTRAL's
    dynamic program and the T3 theorems. Narrower than the source, because the bounds used need it: Allman et al.'s remark on the distance between blobs, on one
    network with M varied, for k >= 2 and small epsilon (E65). Going beyond the source: Allman et al.'s theorem4_iso, by the splits-equivalence theorem. The forms of Allman et al. that the later papers use (exists_reduction_aux, cfDetectable_generic) aren't the
    paper's proofs of its numbered results, which are theorem1, theorem1_b, corollary1. docs/route_differences.tsv records every difference of route.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs with the papers'; a
    separate agent checked the findings. The route check and the three kernels (scripts/check_kernels.sh: Lean's kernel, NanoDa, con-ron) ran locally; Comparator runs on src/MainResults.lean as both challenge and solution, so it compares no separate statement file with a proof.

