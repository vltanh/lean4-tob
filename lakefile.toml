name = "TreeOfBlobs"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
srcDir = "src"
defaultTargets = ["Basic", "External", "TINNiK", "TOBQMC", "ECToBlob", "Gusfield2007", "AllmanEtAl2023", "MainResults"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "9948de9b3cba330596424efd2dca9617be2efb0c"

[[lean_lib]]
name = "Basic"
globs = ["Basic.+"]

[[lean_lib]]
name = "External"
globs = ["External.+"]

[[lean_lib]]
name = "AllmanEtAl2023"
globs = ["AllmanEtAl2023.+"]

[[lean_lib]]
name = "Gusfield2007"
globs = ["Gusfield2007.+"]

[[lean_lib]]
name = "TINNiK"
globs = ["TINNiK.+"]

[[lean_lib]]
name = "TOBQMC"
globs = ["TOBQMC.+"]

[[lean_lib]]
name = "ECToBlob"
globs = ["ECToBlob.+"]

[[lean_lib]]
name = "MainResults"
