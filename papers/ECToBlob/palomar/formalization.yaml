status:
  scope: >-
    Unconditional: no result of the literature is assumed. Every numbered result of ECToBlob is proved as printed or in
    a corrected form (Theorems 3.1, 4.1, 8.2; Lemmas 3.5, 6.1, 8.1; Corollaries 3.6, 4.2, 4.3; Proposition 5.1;
    equations (3.2), (3.3); Remark 3.2). Theorem 8.2 is proved under two corrections, for parameters meeting both
    directions of Assumption 1, and, for two variants of the algorithm, positive alternatives on quartets strictly in
    the T1 null, under the continuous extension of the Cauchy transform; both were agreed with the maintainer. Also
    proved, from what the paper says in passing: its observation in §3 on MQS and displayed trees, its Remarks 3.3, 5.2
    and 8.3, Remark 8.4 for binary networks, with a counterexample on a non-binary one (E35), Remark 3.4 without
    incomplete lineage sorting, the levels of lines 1159-1167, and from its §10 the line test without the no-anomaly
    assumption, a random T0 and data splitting, combining edge p-values, the framework on other tests and on
    sum-of-pairs distances, and what it says of Log-det distances. Not formalized: simulations and empirical tables, and
    results of cited sources that no proof here uses. Running times are counts of operations, with no machine model. See
    Section 9 of papers/ECToBlob/REPORT.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-6 family (exact revision not exposed)"]
      framework: "Codex"
      tool_setup: "formalize-math-paper skill; three sub-agents; shared local workspace. Source audit and foundations, no numbered paper result."
      cost:
        wall_time: "about 1 h 54 min, 2026-10-27"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links; statement corrections asked of the user and approved."
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code (VS Code extension)"
      tool_setup: "formalize-math-paper skill, repository vltanh/formalize-math-paper, commit e339f64 (the last round's log names no commit); Claude Code 2.1.314; 85 sub-agents, at most 11 at once, up to commit 282215c."
      cost:
        wall_time: "29.14 h elapsed, from 2026-10-31 to commit 282215c on 2026-11-01, including 1.67 h for the round that proved the assumed result, 3.36 h for the round that followed the sources and formalized what the papers say in passing, 8.34 h for the round of the two further papers, and 4.61 h for the round that finished what the papers claim; sub-agent work 76.8 h. The documents after that commit are not counted."
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links, continuing from the earlier handoff; later the user asked to match the sources closely, to formalize what the report listed as not formalized, to add Gusfield et al. 2007 and Allman et al. 2023 as primary papers on the library lean4-phylogenetics, and to finish what remained, leaving only empirical claims and wrong statements."
  spend_usd: "not tracked"
  notes: >-
    The user chose the papers and the versions of the first three, agreed to the statement corrections of ECToBlob and TOB-QMC, and decided the library's boundary, the layout, the kernels and publication. AI systems wrote the code, the statements, the audit and the documents. The automation above is for the whole project, which until 2026-11-04 also had Gusfield et al. 2007, since moved to its own repository, lean4-gusfield2007; each of the four papers here has an entry of its own in papers/<Paper>/palomar/. Now src/ has 196 modules; the audit checks every declaration of the project and the library, all on the standard axioms; three kernels accept the 14 main theorems of this entry (scripts/check_kernels.sh papers/ECToBlob/palomar/comparator.json). See docs/CREDITS.md.

fidelity:
  divergences: >-
    Statements corrected (Sections 3, 4 and 6 of papers/ECToBlob/REPORT.md): Theorem 8.2 for parameters meeting
    Assumption 1, as agreed with the maintainer (E10); with positive alternatives for the Cauchy and CBC variants, under
    the continuous extension of the Cauchy transform at p = 1, where the printed formula is undefined, as agreed with
    the maintainer (E11); on binary gene trees, with the displayed tree model on any network proved for Bon and BBC and
    refuted for Cauchy and CBC (E37); equation (3.3) weighted by block sizes (E2). Library statements omit hypotheses
    that the proofs do not use (Section 5 of the report); src/MainResults/ECToBlob.lean keeps them. Readings: Section 6
    of the report and of docs/REPORT.md. False claims found, not formalized as stated: Remark 8.4 on a non-binary
    network (E35), Remark 3.3 under the cited non-strict definition (E36), and NANUQ Theorem 36 as printed.


    Departures from the paper's proofs, every one with what the paper does, what Lean does and why, in Section 7 of the
    report. Repairing gaps or errors: Theorem 3.1 (E2), Remark 3.2 (E1), Corollary 3.6 (E3), Theorem 8.2 (E11-E17);
    Theorem 8.2 on the displayed tree model, where line 1065 is false (E37); NANUQ Theorem 36 (no centroid CF; levels).
    Not forced, and documented: Theorem 4.1 (3-blobs and chains on the unsuppressed graph) and Proposition 5.1 (on the
    network, not on each quarnet); Legried et al. (one edge at a time, term by term; its one statement for any weight is
    forced, since their factorization isn't available for the weight 1/n); Ané et al. Proposition 12, which Remark 3.3
    cites (conditioning at the arc). No printed argument to follow: NANUQ Proposition 9, whose proof here uses facts on
    level-1 blobs in src/Basic and Theorem 5.1 of Huber et al. 2025. docs/route_differences.tsv records every difference
    of route.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs with the papers'; a
    separate agent checked the findings. The route check and the three kernels (scripts/check_kernels.sh: Lean's kernel, NanoDa, con-ron) ran locally; Comparator runs on src/MainResults/ECToBlob.lean as both challenge and solution, so it compares no separate statement file with a proof.

alignment:
  namespace: "TreeOfBlobs"
  statements:
    - source: "ECToBlob, Theorem 3.1"
      lean: "TreeOfBlobs.theorem3_1"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "Condition 2 in the form the proof uses; ECToBlob.pendantChainInvariant_cutExchangeable derives it from the literal form."
    - source: "ECToBlob, Theorem 4.1"
      lean: "TreeOfBlobs.theorem4_1"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "As printed."
    - source: "ECToBlob, Theorem 8.2"
      lean: "TreeOfBlobs.theorem8_2"
      module: "MainResults.ECToBlob"
      status: "proved, corrected"
      note: "Corrections E10 and E11, agreed. Binary gene trees."
    - source: "ECToBlob, Theorem 8.2, displayed tree model"
      lean: "TreeOfBlobs.ectoblob_theorem8_2_displayed"
      module: "MainResults.ECToBlob"
      status: "proved, corrected"
      note: "For Bon and BBC, on any network. The paper's line 1065 is false under this model, and only its lower bound is used."
    - source: "ECToBlob, Theorem 8.2, displayed tree model, a counterexample"
      lean: "TreeOfBlobs.ectoblob_displayed_counterexample"
      module: "MainResults.ECToBlob"
      status: "proved, refutes the source"
      note: "For Cauchy and CBC, resting on the extension of the Cauchy transform at p = 1 (E7)."
    - source: "ECToBlob, Theorem 8.2 without the hypothesis on the alternatives"
      lean: "TreeOfBlobs.ectoblob_not_theorem8_2_without_hpos"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "The correction E11 is necessary, at all sequences of levels."
    - source: "ECToBlob, §10, combining edge p-values under CBC"
      lean: "TreeOfBlobs.ectoblob_not_consistency_edge_combination_cbc"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "On one law meeting Assumption 1; the general case under the NMSC stays a sketch."
    - source: "ECToBlob, Remark 3.4"
      lean: "TreeOfBlobs.ectoblob_remark3_4_displays"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "For the source's cited [24] without incomplete lineage sorting, with any law on each edge."
    - source: "ECToBlob, §10, the framework on distances"
      lean: "TreeOfBlobs.ectoblob_consistency_sumOfPairs"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "For Bon and BBC, by Hoeffding contrast p-values."
    - source: "ECToBlob, equation (3.3) as printed"
      lean: "TreeOfBlobs.ectoblob_not_equation33Printed"
      module: "MainResults.ECToBlob"
      status: "proved, refutes the source"
      note: "E2."
    - source: "ECToBlob, Theorem 8.2 on the literal general model"
      lean: "TreeOfBlobs.ectoblob_not_theorem8_2_literal"
      module: "MainResults.ECToBlob"
      status: "proved, refutes the literal reading"
      note: "E10. About ECToBlob's levels, on an abstract model; not a counterexample under the NMSC."
    - source: "NANUQ, Proposition 9"
      lean: "TreeOfBlobs.nanuq_proposition9_source"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "In the source's own terms, Definitions 4 and 5 and m_k-cycles. The source gives no proof."
    - source: "NANUQ, Theorem 36, gene trees on subsets of the taxa"
      lean: "TreeOfBlobs.nanuq_theorem36_missing"
      module: "MainResults.ECToBlob"
      status: "proved, corrected"
      note: "Up to the distance. Levels and no centroid CF as in the corrected theorem."
    - source: "Legried et al. 2021, Theorem 1"
      lean: "TreeOfBlobs.legried_theorem1"
      module: "MainResults.ECToBlob"
      status: "proved"
      note: "On quartets, with an arbitrary law on each edge."

acknowledgements: "Lean, Mathlib; the Phylogenetics library of the maintainer (lean4-phylogenetics), for adapted Kingman coalescent modules; the authors of the papers and sources."
