version: "v0.4"

project:
  name: "ECToBlob: statistical inference of the tree of blobs from quartet concordance factors"
  description: >-
    A Lean formalization of ECToBlob (Rhodes, Allman, Ané, Baños 2026), which infers the tree of blobs of a phylogenetic
    network from gene trees under the network multispecies coalescent. No result of the literature is assumed. No person
    has reviewed the proofs.


    Proved: optimal trees of the maximum quartet support criterion resolve the tree of blobs (Theorem 3.1); if every
    quartet across a quadripartition has the split as a cut-edge split then the network has that cut edge (Theorem 4.1);
    statistical consistency of the ECToBlob algorithm for all its variants, with sequences of levels independent of the
    network (Theorem 8.2); every other numbered result, and what the paper says in passing. Of the sources it cites,
    NANUQ's Theorem 36, corrected, with its Proposition 9, and Theorem 1 of Legried et al. 2021 on quartets.


    The audit records E1-E17, E35-E38, E41 and E68 on the paper, including a counterexample to a boundary case of
    Theorem 8.2 and a gap in its proof that needed a new argument, and E80 and E84 on the two sources above.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

