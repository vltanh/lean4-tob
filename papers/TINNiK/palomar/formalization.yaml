# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "TINNiK: inference of the tree of blobs of a species network under the coalescent model"
  description: >-
    A Lean formalization of TINNiK (Allman, Baños, Mitchell, Rhodes 2024), which infers the tree of blobs of a species
    network from quartet concordance factors with hypothesis tests and the B-quartet inference rule. No result of the
    literature is assumed. No person has reviewed the proofs.


    Proved: statistical consistency of the TINNiK algorithm (Theorem 4), with the paper's levels, and with the T3 test;
    the maximum likelihood estimates of Appendix C.1, and Propositions 5 and 6 of Appendix C.2, the limit law of the cut
    test and its density; neighbor joining in its Step 4; the algorithm with missing taxa; the counts behind its running
    times. Of the sources it cites, Propositions 4.1, 4.2, 5.1 and 5.2 of Mitchell, Allman, Rhodes 2019, and that the
    Lemma of Studier, Keppler 1988 fails at a polytomy.


    The audit records E29-E33, E40 and E75 on the paper, and E82 on Mitchell et al. 2019.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

